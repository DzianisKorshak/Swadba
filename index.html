<title>Пьяная Свадьба</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7ede0;
    --surface:#ffffff;
    --surface-2:#fbf5ea;
    --text:#2a1620;
    --text-dim:#7a5760;
    --accent:#8c1f3f;
    --accent-ink:#ffffff;
    --gold:#a9781c;
    --border:#e6d5c3;
    --good:#3f7d4f;
    --bad:#b23b3b;
    --shadow: 0 10px 30px -12px rgba(60,20,30,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1218;
      --surface:#261821;
      --surface-2:#2d1c27;
      --text:#f4e7e1;
      --text-dim:#b99aa3;
      --accent:#e0577e;
      --accent-ink:#1c1218;
      --gold:#e0b84a;
      --border:#3c2733;
      --good:#6bc27f;
      --bad:#f0768a;
      --shadow: 0 10px 30px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1218;
    --surface:#261821;
    --surface-2:#2d1c27;
    --text:#f4e7e1;
    --text-dim:#b99aa3;
    --accent:#e0577e;
    --accent-ink:#1c1218;
    --gold:#e0b84a;
    --border:#3c2733;
    --good:#6bc27f;
    --bad:#f0768a;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Manrope",system-ui,sans-serif;
    padding-inline:16px;
    padding-block:16px;
    min-height:100%;
  }
  html,body{height:100%}
  h1,h2,h3,.display{font-family:"Unbounded",system-ui,sans-serif;text-wrap:balance}
  p{line-height:1.5}
  button{font-family:inherit;font-size:15px;cursor:pointer;border:none}
  input{font-family:inherit;font-size:16px}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  #app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:calc(100% - 32px)}

  .topbar{
    display:flex;flex-direction:column;gap:8px;
    padding:10px 14px;border-radius:16px;background:var(--surface);
    border:1px solid var(--border);box-shadow:var(--shadow);
  }
  .topbar-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .topbar-row2{display:flex;gap:6px;flex-wrap:wrap}
  .topbar .title{font-family:"Unbounded";font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
  .topbar .title .ring{font-size:16px;flex-shrink:0}
  .topbar .title .ttext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{
    font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
    background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);
    white-space:nowrap;
  }
  .pill.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:20px;box-shadow:var(--shadow);
  }
  .card h2{font-size:19px;margin:0 0 6px}
  .card .sub{color:var(--text-dim);font-size:14px;margin:0 0 14px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px;
    background:var(--accent);color:var(--accent-ink);width:100%;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.small{padding:9px 12px;font-size:13px;width:auto}
  .btn.gold{background:var(--gold);color:#241708}

  label{font-size:13px;font-weight:700;color:var(--text-dim);display:block;margin-bottom:6px}
  input[type=text]{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);
  }
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .ptile{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 8px;border-radius:14px;border:2px solid var(--border);
    background:var(--surface-2);text-align:center;position:relative;
  }
  .ptile.selectable{cursor:pointer}
  .ptile.selectable:hover{border-color:var(--accent)}
  .ptile.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--surface-2))}
  .ptile.dead{opacity:.4}
  .ptile .avatar{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:"Unbounded";font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);
  }
  .ptile .nm{font-size:12.5px;font-weight:600;line-height:1.2;word-break:break-word}
  .ptile .tag{font-size:10px;color:var(--gold);font-weight:700}
  .ptile .dead-mark{position:absolute;top:4px;right:8px;font-size:11px}

  .toggle-row{display:flex;gap:10px}
  .toggle{
    flex:1;padding:14px;border-radius:14px;border:2px solid var(--border);
    background:var(--surface-2);text-align:center;font-weight:700;font-size:14px;color:var(--text-dim);
  }
  .toggle.on-yes.active{border-color:var(--good);color:var(--good);background:color-mix(in srgb, var(--good) 14%, var(--surface-2))}
  .toggle.on-no.active{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb, var(--bad) 14%, var(--surface-2))}

  .keybox{
    display:flex;gap:8px;flex-wrap:wrap;
  }
  .keyword{
    background:var(--surface-2);border:1px dashed var(--gold);color:var(--gold);
    font-weight:800;font-family:"Unbounded";font-size:13px;padding:8px 12px;border-radius:10px;
  }
  .hint{font-size:13px;color:var(--text-dim);margin-top:10px;line-height:1.5}

  .timerwrap{display:flex;align-items:center;gap:10px}
  .timerbar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
  .timerbar > div{height:100%;background:var(--accent);transition:width 1s linear}
  .timernum{font-variant-numeric:tabular-nums;font-weight:800;font-family:"Unbounded";font-size:15px;min-width:34px;text-align:right}

  .rolecard{
    background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 18%, var(--surface)), var(--surface));
    border:1px solid var(--accent);
  }
  .rolecard .rolename{font-family:"Unbounded";font-size:22px;font-weight:800;color:var(--accent)}

  .banner{
    text-align:center;padding:14px;border-radius:14px;background:var(--surface-2);
    border:1px solid var(--border);font-weight:600;font-size:14px;
  }
  .banner.win{background:color-mix(in srgb, var(--good) 16%, var(--surface));border-color:var(--good);color:var(--good);font-family:"Unbounded";font-size:16px}
  .banner.lose{background:color-mix(in srgb, var(--bad) 16%, var(--surface));border-color:var(--bad);color:var(--bad);font-family:"Unbounded";font-size:16px}

  .footer-actions{position:sticky;bottom:0;padding-top:6px}

  .rules-list{margin:0;padding-left:18px;color:var(--text-dim);font-size:13.5px;line-height:1.7}
  .divider{height:1px;background:var(--border);margin:14px 0}

  .center-note{text-align:center;color:var(--text-dim);font-size:14px;padding:24px 10px}
  .spin{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);
    margin:0 auto 12px;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .lbrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
  .lbrow:last-child{border-bottom:none}
  .lbrow .score{font-family:"Unbounded";font-weight:700;color:var(--gold)}
  .rolebadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}

  .icon-btn{
    width:32px;height:32px;border-radius:10px;background:var(--surface-2);color:var(--text-dim);
    border:1px solid var(--border);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(.95)}
  .topbar-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}

  .round-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .round-tab{padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
  .round-tab.active{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .log-entry{padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;line-height:1.5}
  .log-entry:last-child{border-bottom:none}

  .testbar{
    display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:14px;
    background:color-mix(in srgb, var(--gold) 14%, var(--surface));border:1px dashed var(--gold);
  }
  .testselect{
    flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:13px;
  }

  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
  .setting-row:last-child{border-bottom:none}
  .setting-row .lbl{font-weight:700;font-size:14px}
  .setting-row .sublbl{font-size:12px;color:var(--text-dim);margin-top:2px}
  select.mini{
    padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;
  }
  .switch{
    width:46px;height:27px;border-radius:99px;background:var(--border);position:relative;flex-shrink:0;border:none;padding:0;
  }
  .switch.on{background:var(--good)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s ease}
  .switch.on::after{left:22px}

  .comp-row{display:flex;align-items:flex-start;gap:8px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
  .comp-row:last-child{border-bottom:none}
  .comp-row .txt{flex:1;line-height:1.55}
  .comp-row .rm{width:26px;height:26px;border-radius:8px;background:var(--surface-2);color:var(--bad);border:1px solid var(--border);flex-shrink:0}

  .order-list{margin:0;padding-left:20px;color:var(--text);font-size:14px;line-height:2}
  .order-list li b{color:var(--accent)}
  .steplbl{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--gold);text-transform:uppercase}

  .role-hidden{cursor:pointer;text-align:center}
  .role-hidden .peek{font-family:"Unbounded";font-size:15px;font-weight:700;color:var(--accent)}
  .keyinputs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .miniform{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
  .stack{display:flex;flex-direction:column;gap:8px}
</style>

<div id="app">
  <div class="center-note"><div class="spin"></div>Наливаем…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyBtyyKGaWjpQzj6CI9zbyLoLoto8VPGh4w",
    authDomain: "drunkwedding.firebaseapp.com",
    projectId: "drunkwedding",
    storageBucket: "drunkwedding.firebasestorage.app",
    messagingSenderId: "1045128400166",
    appId: "1:1045128400166:web:e9aa75a4e553b8ab4fc5e7"
  };
  firebase.initializeApp(firebaseConfig);

  // ---------- static data ----------
  var KEY_POOL = [
    ["маяк","чайка","шторм"],
    ["костёр","снег","волк"],
    ["скрипка","вальс","занавес"],
    ["сад","роса","соловей"],
    ["карта","компас","река"],
    ["зеркало","свеча","полночь"],
    ["паровоз","письмо","перрон"],
    ["якорь","парус","горизонт"],
    ["виноград","бочка","погреб"],
    ["колокол","снегирь","мороз"],
    ["гармонь","частушка","каблук"],
    ["невод","омут","русалка"]
  ];
  var COMPETITIONS = [
    { name:"Штанопровод", desc:"Прокатить яйцо из одной штанины в другую быстрее соперника." },
    { name:"Снайпер с подвохом", desc:"Привязать на нитку карандаш, закрепить нитку на поясе сзади и первым попасть карандашом в горлышко бутылки, стоящей позади себя." },
    { name:"Лимонная улыбка", desc:"Съесть по дольке лимона с улыбкой, не поморщившись — кто дольше держит лицо." },
    { name:"Дрожащее желе", desc:"Съесть порцию желе из тарелки, держа руки за спиной и орудуя только двумя зубочистками (или спичками)." },
    { name:"Яичная дуэль", desc:"К поясу каждому участнику привязывают целлофановый пакет с сырым яйцом; раскачиваясь, нужно разбить яйцо соперника и сохранить своё целым." },
    { name:"Папирусная мумия", desc:"В паре один игрок должен как можно быстрее с головы до ног обмотать другого рулоном туалетной бумаги, превратив в мумию." },
    { name:"Шарикодавилки", desc:"Пара встаёт лицом друг к другу и зажимает между собой надутый воздушный шарик, стараясь лопнуть его без помощи рук." },
    { name:"Банан без рук", desc:"Руки за спину, на коленях перед табуреткой — нужно ртом очистить и съесть неочищенный банан быстрее соперников." },
    { name:"Огнеборец", desc:"К поясу привязывают верёвку с мокрой ватой (или спичечным коробком) на конце; не касаясь руками, нужно первым потушить стоящую перед собой свечу." },
    { name:"Я не магл", desc:"Скрутить салфетку в трубочку, поставить и поджечь сверху — если всё получится, пепел взлетит вверх. У кого не взлетел — тот проиграл." }
  ];

  function normComp(c){
    if(typeof c === "string") return { name:"Конкурс", desc:c };
    return { name: (c && c.name) || "Конкурс", desc: (c && c.desc) || "" };
  }
  var ROLE_LABEL = {
    guest:"Гость", jigit:"Джигит", zhenih:"Жених", nevesta:"Невеста",
    byvshaya:"Бывшая", fotograf:"Фотограф"
  };
  var ROLE_DESC = {
    guest:"Ты обычный гость. Твоя цель — вычислить джигитов и не спалить невесту. Ночью ты выбираешь, кого подозреваешь, и голосуешь, изгонять ли тостующего.",
    jigit:"Ты хочешь украсть невесту. Пока живы гости, воруй их по одному. Невесту можно красть только когда обычных гостей не осталось. Ты видишь все три слова ключа, но часть из них — подделка: угадать, какие слова настоящие, тебе придётся по чужим тостам.",
    zhenih:"Ты ревнивый жених. Каждую ночь можешь набить морду одному человеку (кроме невесты) — тот не сможет этой ночью совершить своё действие. Если ты сам попадёшься бывшей на танец, набить морду не выйдет.",
    nevesta:"Твоя роль открыта всем. Перед первым угаром ты сама придумываешь ключ из трёх слов. Каждый раунд ты выбираешь, кто говорит следующий тост (сама или через конкурс), запускаешь ночь, можешь дважды за игру сменить ключ на новый и решаешь исход конкурса при ничьей.",
    byvshaya:"Ты уводишь кого-то танцевать. Тот, кого ты выберешь, не сможет в эту ночь совершить своё действие.",
    fotograf:"Ты следишь за камерой. Каждое утро узнаёшь, просыпался ли выбранный тобой человек этой ночью."
  };

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function jigitWordCount(roleConfig){
    return (roleConfig && roleConfig.jigitKeyWords==="1") ? 1 : 2;
  }
  var keyDraft = ["","",""];
  function fillRandomKeyInputs(){
    var words = KEY_POOL[Math.floor(Math.random()*KEY_POOL.length)];
    keyDraft = words.slice();
    var i1=document.getElementById("kw1"), i2=document.getElementById("kw2"), i3=document.getElementById("kw3");
    if(i1) i1.value = words[0];
    if(i2) i2.value = words[1];
    if(i3) i3.value = words[2];
  }
  function keyInputsHtml(){
    return '<div class="keyinputs">'+
      '<input type="text" id="kw1" placeholder="Слово 1" value="'+esc(keyDraft[0])+'"/>'+
      '<input type="text" id="kw2" placeholder="Слово 2" value="'+esc(keyDraft[1])+'"/>'+
      '<input type="text" id="kw3" placeholder="Слово 3" value="'+esc(keyDraft[2])+'"/>'+
      '</div>';
  }
  function bindKeyInputs(){
    ["kw1","kw2","kw3"].forEach(function(id, i){
      var el = document.getElementById(id);
      if(el) el.oninput = function(){ keyDraft[i] = el.value; };
    });
  }
  function initials(name){
    return (name||"?").trim().slice(0,2).toUpperCase();
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var root = document.getElementById("app");
  function render(html){ root.innerHTML = html; bindChrome(); }

  function bindChrome(){
    var ib = document.getElementById("infoBtn");
    if(ib) ib.onclick = function(){ navOverride="info"; renderCurrent(); };
    var sb = document.getElementById("settingsBtn");
    if(sb) sb.onclick = function(){ navOverride="settings"; renderCurrent(); };
    var cb2 = document.getElementById("compsBtn");
    if(cb2) cb2.onclick = function(){ navOverride="competitions"; renderCurrent(); };
    var lgb = document.getElementById("logBtn");
    if(lgb) lgb.onclick = function(){ navOverride="log"; renderCurrent(); };
    var backTop = document.getElementById("backTopBtn");
    if(backTop) backTop.onclick = function(){ navOverride=null; renderCurrent(); };
    root.querySelectorAll("[data-back]").forEach(function(el){
      el.onclick = function(){ navOverride=null; renderCurrent(); };
    });
    var sw = document.getElementById("activeUidSelect");
    if(sw) sw.onchange = function(){ setActiveUid(sw.value); renderCurrent(); };
    var addBot = document.getElementById("addBotBtn");
    if(addBot) addBot.onclick = addTestPlayer;
    var rrb = document.getElementById("roleRevealBtn");
    if(rrb) rrb.onclick = toggleRoleReveal;
  }

  var roleRevealed = false, roleRevealTimer = null;
  function toggleRoleReveal(){
    if(roleRevealed) return;
    roleRevealed = true;
    clearTimeout(roleRevealTimer);
    roleRevealTimer = setTimeout(function(){ roleRevealed=false; renderCurrent(); }, 8000);
    renderCurrent();
  }

  // ---------- boot ----------
  var db=null, myUid=null, activeUid=null, navOverride=null, resetArmed=false;
  var gameState=null, players={}, actions={};
  var keyFormOpen=false, speakerCompeteTask=null, logRoundSel=null;
  var unsubs=[];

  function setActiveUid(uid){
    activeUid = uid;
    try{ sessionStorage.setItem("svadba_activeUid", uid); }catch(e){}
  }

  function renderCurrent(){
    if(navOverride==="settings"){ screenSettings(); return; }
    if(navOverride==="info"){ screenInfo(); return; }
    if(navOverride==="competitions"){ screenCompList(); return; }
    if(navOverride==="log"){ screenLog(); return; }
    draw();
  }

  function centerMsg(text){
    render('<div class="center-note"><div class="spin"></div>'+esc(text)+'</div>');
  }

  async function boot(){
    try{
      db = firebase.firestore();
      myUid = await new Promise(function(resolve, reject){
        var timeout = setTimeout(function(){ reject(new Error("auth timeout")); }, 15000);
        firebase.auth().onAuthStateChanged(function(u){
          if(u){ clearTimeout(timeout); resolve(u.uid); }
        }, function(err){ clearTimeout(timeout); reject(err); });
        firebase.auth().signInAnonymously().catch(function(err){ clearTimeout(timeout); reject(err); });
      });
    }catch(e){
      render(
        '<div class="topbar"><div class="title"><span class="ring">💍</span> Пьяная Свадьба</div></div>'+
        '<div class="card"><h2>Не получилось подключиться</h2>'+
        '<p class="sub">Проверь интернет-соединение и обнови страницу. Если не поможет — попробуй другой браузер.</p></div>'
      );
      return;
    }

    activeUid = myUid;
    try{
      var saved = sessionStorage.getItem("svadba_activeUid");
      if(saved) activeUid = saved;
    }catch(e){}

    subscribeAll();
  }

  function countByRoleTarget(n, roleConfig){
    roleConfig = roleConfig || {};
    var jigitCount = roleConfig.jigitCount==="2" ? 2 : roleConfig.jigitCount==="3" ? 3 : 1;
    var hasZhenih = roleConfig.zhenih==="off" ? false : true;
    var hasByvshaya = roleConfig.byvshaya==="on" ? true : false;
    var hasFotograf = roleConfig.fotograf==="on" ? true : false;
    var fixed = 1 + jigitCount + (hasZhenih?1:0) + (hasByvshaya?1:0) + (hasFotograf?1:0); // nevesta+jigits+...
    return { jigitCount:jigitCount, hasZhenih:hasZhenih, hasByvshaya:hasByvshaya, hasFotograf:hasFotograf, guests: Math.max(0, n-fixed) };
  }

  async function startGame(){
    var uids = Object.keys(players);
    var n = uids.length;
    if(n < 4) return alert2("Нужно минимум 4 игрока.");
    var roleConfig = gameState && gameState.roleConfig;
    var cfg = countByRoleTarget(n, roleConfig);

    var forcedBride = roleConfig && roleConfig.brideUid;
    if(forcedBride && !players[forcedBride]) forcedBride = null;
    var order = forcedBride
      ? [forcedBride].concat(shuffle(uids.filter(function(u){ return u!==forcedBride; })))
      : shuffle(uids);

    var roleSeq = ["nevesta"];
    if(cfg.hasZhenih) roleSeq.push("zhenih");
    for(var i=0;i<cfg.jigitCount;i++) roleSeq.push("jigit");
    if(cfg.hasByvshaya) roleSeq.push("byvshaya");
    if(cfg.hasFotograf) roleSeq.push("fotograf");
    while(roleSeq.length < n) roleSeq.push("guest");

    var brideUid=null, zhenihUid=null, byvshayaUid=null, fotografUid=null, jigits=[];

    var writes = [];
    for(var idx=0; idx<order.length; idx++){
      var uid = order[idx];
      var role = roleSeq[idx];
      if(role==="nevesta") brideUid = uid;
      if(role==="zhenih") zhenihUid = uid;
      if(role==="byvshaya") byvshayaUid = uid;
      if(role==="fotograf") fotografUid = uid;
      if(role==="jigit") jigits.push(uid);
      writes.push(db.doc("players/"+uid).update({
        role: role, alive: true, key: null, suspicionScore: 0,
        keyChangesUsed: role==="nevesta" ? 0 : undefined
      }).catch(function(){}));
    }
    await Promise.all(writes);

    var guestsInitial = roleSeq.filter(function(r){return r==="guest"}).length;

    await db.doc("game/state").set({
      started:true, phase:"keysetup", round:1,
      speakerUid: null, keySet:false,
      mainJigitUid: jigits[0]||null, jigit2Uid: jigits[1]||null, jigit3Uid: jigits[2]||null,
      allJigits: jigits, jigitSuspicionTotals: {},
      zhenihUid: zhenihUid, byvshayaUid: byvshayaUid, fotografUid: fotografUid, brideUid: brideUid,
      guestsAliveInitial: guestsInitial, guestsAliveTotal: guestsInitial,
      finalNight:false, winner:null,
      currentKeys: null,
      tieCompetition: null, lastSummary: null, phaseEndsAt: null,
      testMode: gameState && gameState.testMode || false,
      roleConfig: roleConfig || null,
      competitionsList: gameState && gameState.competitionsList || null,
      gameLog: [{round:1, text:"Свадьба началась! Невеста готовится объявить ключ из трёх слов.", t:Date.now()}]
    });
  }

  function fakeWordPool(exclude){
    var pool = [];
    KEY_POOL.forEach(function(triple){
      triple.forEach(function(w){ if(pool.indexOf(w)===-1) pool.push(w); });
    });
    pool = shuffle(pool.filter(function(w){ return exclude.indexOf(w)===-1; }));
    return pool;
  }

  async function applyKeyWords(words){
    var n = jigitWordCount(gameState && gameState.roleConfig);
    var full = words.map(function(w){ return w.trim(); });
    var chosenIdx = shuffle([0,1,2]).slice(0, n).sort(function(a,b){return a-b});
    var used = full.slice();
    var decoys = fakeWordPool(full);
    var jigitWords = full.map(function(w, i){
      if(chosenIdx.indexOf(i)!==-1) return w;
      var fake = decoys.length ? decoys.shift() : ("тайна-"+Math.floor(Math.random()*90+10));
      used.push(fake);
      return fake;
    });
    var keys = { full: full, jigitWords: jigitWords, jigitRealIdx: chosenIdx };
    var writes = [];
    Object.keys(players).forEach(function(uid){
      if(!players[uid].alive) return;
      var role = players[uid].role;
      var key = role==="jigit" ? keys.jigitWords : keys.full;
      writes.push(db.doc("players/"+uid).update({key:key}).catch(function(){}));
    });
    await Promise.all(writes);
    return keys;
  }

  function getCompetitions(){
    return (gameState && gameState.competitionsList && gameState.competitionsList.length) ? gameState.competitionsList : COMPETITIONS;
  }

  async function resolveNight(){
    var round = gameState.round;
    try{
      await db.runTransaction(function(tx){
        var ref = db.doc("game/state");
        return tx.get(ref).then(function(snap){
          var cur = snap.exists ? snap.data() : {};
          if(cur.phase!=="night" || cur.round!==round || cur.resolvingLock) throw "ALREADY_RESOLVED";
          tx.update(ref, {resolvingLock:true});
        });
      });
    }catch(e){ return; }
    var alive = Object.keys(players).filter(function(u){return players[u].alive});
    function actOf(uid){
      var a = actions[uid];
      return (a && a.round===round) ? a : null;
    }

    // Бывшая и жених оба блокируют ночные действия (уводит танцевать / бьёт морду).
    // Если они нацелились друг на друга взаимно — блоки аннулируют друг друга.
    var byvshayaUid = gameState.byvshayaUid;
    var zhenihUid = gameState.zhenihUid;
    var bTarget = null, zTarget = null;
    if(byvshayaUid && players[byvshayaUid] && players[byvshayaUid].alive){
      var ab = actOf(byvshayaUid);
      if(ab && ab.target) bTarget = ab.target;
    }
    if(zhenihUid && players[zhenihUid] && players[zhenihUid].alive){
      var az = actOf(zhenihUid);
      if(az && az.target && az.target!==gameState.brideUid) zTarget = az.target;
    }
    var zhenihNullified = bTarget===zhenihUid;
    var byvshayaNullified = zTarget===byvshayaUid;
    var blockedSet = [];
    if(bTarget && !byvshayaNullified) blockedSet.push(bTarget);
    if(zTarget && !zhenihNullified) blockedSet.push(zTarget);
    function isBlocked(uid){ return blockedSet.indexOf(uid)!==-1; }

    var mainJigitUid = gameState.mainJigitUid;
    var stealTarget = null;
    if(mainJigitUid && players[mainJigitUid] && players[mainJigitUid].alive && !isBlocked(mainJigitUid)){
      var aj = actOf(mainJigitUid);
      if(aj && aj.target){
        var validBride = aj.target===gameState.brideUid && gameState.guestsAliveTotal===0;
        var validOther = aj.target!==gameState.brideUid;
        if(validBride || validOther) stealTarget = aj.target;
      }
    }

    var summary = { round: round, stolen:null, exiled:null, tie:false, brideStolen:false };
    var writes = [];

    if(stealTarget){
      if(stealTarget===gameState.brideUid){
        summary.brideStolen = true;
      } else {
        writes.push(db.doc("players/"+stealTarget).update({alive:false}));
        summary.stolen = stealTarget;
      }
    }

    var fotografUid = gameState.fotografUid;
    if(fotografUid && players[fotografUid] && players[fotografUid].alive && !isBlocked(fotografUid)){
      var af = actOf(fotografUid);
      if(af && af.target){
        var targetActed = false;
        var ta = actOf(af.target);
        var tRole = players[af.target] ? players[af.target].role : null;
        var isActiveRole = tRole==="jigit"||tRole==="zhenih"||tRole==="byvshaya"||tRole==="fotograf";
        var tIsMain = af.target===mainJigitUid;
        var tBlocked = isBlocked(af.target);
        if(isActiveRole && ta && ta.target && !tBlocked && (tRole!=="jigit" || tIsMain)) targetActed = true;
        writes.push(db.doc("players/"+fotografUid).update({
          lastPhotoResult:{round:round, target:af.target, woke:targetActed}
        }));
      }
    }

    var exile=0, keep=0;
    alive.forEach(function(uid){
      if(players[uid].role!=="guest") return;
      var av = actOf(uid);
      if(av && av.exileVote==="exile") exile++;
      else if(av && av.exileVote==="keep") keep++;
    });

    var speaker = gameState.speakerUid;
    var newFinalNight = gameState.finalNight;
    var winner = null;
    var tieCompetition = null;

    if(!summary.brideStolen){
      if(exile>0 || keep>0){
        if(exile===keep){
          var others = alive.filter(function(u){return u!==speaker});
          var opponent = others.length ? shuffle(others)[0] : speaker;
          var compList = getCompetitions();
          tieCompetition = { active:true, a:speaker, b:opponent, task: normComp(compList[Math.floor(Math.random()*compList.length)]) };
          summary.tie = true;
        } else if(exile>keep){
          writes.push(db.doc("players/"+speaker).update({alive:false}));
          summary.exiled = speaker;
        }
      }
    }

    var jigitSuspicionDelta = {};
    alive.forEach(function(uid){
      if(players[uid].role!=="guest") return;
      var av = actOf(uid);
      if(av && av.target){
        var guessedRole = players[av.target] ? players[av.target].role : null;
        if(guessedRole==="jigit"){
          var patchObj = { suspicionScore:(players[uid].suspicionScore||0)+1 };
          if(players[uid].firstCorrectRound==null) patchObj.firstCorrectRound = round;
          writes.push(db.doc("players/"+uid).update(patchObj));
          jigitSuspicionDelta[av.target] = (jigitSuspicionDelta[av.target]||0)+1;
        }
      }
    });

    await Promise.all(writes);

    // recompute alive sets post-writes for guests count / win checks
    var stillAlive = {};
    Object.keys(players).forEach(function(u){ stillAlive[u]=players[u].alive; });
    if(summary.stolen) stillAlive[summary.stolen]=false;
    if(summary.exiled) stillAlive[summary.exiled]=false;

    var guestsLeft = Object.keys(players).filter(function(u){
      return players[u].role==="guest" && stillAlive[u]!==false;
    }).length;

    var jigitsLeft = (gameState.allJigits||[gameState.mainJigitUid,gameState.jigit2Uid].filter(Boolean)).filter(function(u){
      return u && stillAlive[u]!==false;
    });
    var newMainJigit = jigitsLeft[0] || null;

    if(summary.brideStolen){
      winner = "jigits";
    } else if(jigitsLeft.length===0){
      winner = "guests";
    }

    var jigitSuspicionTotals = Object.assign({}, gameState.jigitSuspicionTotals||{});
    Object.keys(jigitSuspicionDelta).forEach(function(u){
      jigitSuspicionTotals[u] = (jigitSuspicionTotals[u]||0) + jigitSuspicionDelta[u];
    });

    var patch = {
      lastSummary: summary,
      guestsAliveTotal: guestsLeft,
      mainJigitUid: newMainJigit,
      tieCompetition: tieCompetition,
      jigitSuspicionTotals: jigitSuspicionTotals,
      resolvingLock: false
    };

    if(winner){
      patch.winner = winner;
      patch.phase = "ended";
    } else if(tieCompetition){
      patch.phase = "competition";
    } else {
      patch.round = round+1;
      patch.phase = "morning";
      patch.finalNight = guestsLeft===0;
    }

    var logLines = [];
    if(summary.brideStolen) logLines.push("Невесту похитили прямо из-под венца! Джигиты побеждают.");
    var vanishedUids = [];
    if(summary.stolen) vanishedUids.push(summary.stolen);
    if(summary.exiled && vanishedUids.indexOf(summary.exiled)===-1) vanishedUids.push(summary.exiled);
    vanishedUids.forEach(function(uid){
      var role = players[uid] ? ROLE_LABEL[players[uid].role] : "?";
      logLines.push((players[uid]?players[uid].name:"Кто-то")+" этой ночью исчез(ла) со свадьбы и больше не появится. Роль: "+role+".");
    });
    if(summary.tie) logLines.push("Голоса разделились поровну — судьбу тостующего решит конкурс.");
    if(!logLines.length) logLines.push("Этой ночью ничего заметного не произошло.");
    if(winner) logLines.push(winner==="guests" ? "Гости побеждают — все джигиты изгнаны!" : "Джигиты похитили невесту и победили.");

    await db.doc("game/state").update(patch);
    await appendLog(logLines.join(" "), round);
  }

  async function resolveCompetition(loserUid){
    var winner = null;
    var roundForLog = gameState.round;
    await db.doc("players/"+loserUid).update({alive:false});
    var stillAlive = {};
    Object.keys(players).forEach(function(u){ stillAlive[u]=players[u].alive; });
    stillAlive[loserUid]=false;

    var jigitsLeft = (gameState.allJigits||[gameState.mainJigitUid,gameState.jigit2Uid].filter(Boolean)).filter(function(u){
      return u && stillAlive[u]!==false;
    });
    var newMainJigit = jigitsLeft[0] || null;
    if(jigitsLeft.length===0) winner = "guests";

    var guestsLeft = Object.keys(players).filter(function(u){
      return players[u].role==="guest" && stillAlive[u]!==false;
    }).length;

    var patch = { mainJigitUid:newMainJigit, guestsAliveTotal:guestsLeft, tieCompetition:null };
    if(winner){
      patch.winner=winner; patch.phase="ended";
    } else {
      patch.round = gameState.round+1;
      patch.phase = "morning";
      patch.finalNight = guestsLeft===0;
      patch.lastSummary = Object.assign({}, gameState.lastSummary, {exiled: loserUid, tie:false});
    }
    await db.doc("game/state").update(patch);
    var loserRole = players[loserUid] ? ROLE_LABEL[players[loserUid].role] : "?";
    var compLog = (players[loserUid]?players[loserUid].name:"Игрок")+" проиграл(а) конкурс при ничьей и выбывает. Его/её роль: "+loserRole+".";
    if(winner) compLog += " Гости побеждают — все джигиты изгнаны!";
    await appendLog(compLog, roundForLog);
  }

      if(tn) tn.textContent = left;

      }

    tick();
    timerInterval = setInterval(tick, 1000);

        '<select class="mini" id="cfgJigit">'+
          '<option value="1"'+(!cfg.jigitCount||cfg.jigitCount==="1"?" selected":"")+'>1 (по умолчанию)</option>'+
          '<option value="2"'+(cfg.jigitCount==="2"?" selected":"")+'>2</option>'+
          '<option value="3"'+(cfg.jigitCount==="3"?" selected":"")+'>3</option>'+
        '</select></div>'+
      '<div class="setting-row"><div class="lbl">Жених</div>'+
        '<select class="mini" id="cfgZhenih">'+
          '<option value="on"'+(!cfg.zhenih||cfg.zhenih==="on"?" selected":"")+'>Вкл.</option>'+
          '<option value="off"'+(cfg.zhenih==="off"?" selected":"")+'>Выкл.</option>'+
        '</select></div>'+
      '<div class="setting-row"><div class="lbl">Фотограф</div>'+
        '<select class="mini" id="cfgFotograf">'+
          '<option value="off"'+(!cfg.fotograf||cfg.fotograf==="off"?" selected":"")+'>Выкл.</option>'+
          '<option value="on"'+(cfg.fotograf==="on"?" selected":"")+'>Вкл.</option>'+
        '</select></div>'+
      '<div class="setting-row"><div class="lbl">Бывшая</div>'+
        '<select class="mini" id="cfgByvshaya">'+
          '<option value="off"'+(!cfg.byvshaya||cfg.byvshaya==="off"?" selected":"")+'>Выкл.</option>'+
          '<option value="on"'+(cfg.byvshaya==="on"?" selected":"")+'>Вкл.</option>'+
        '</select></div>'+
      '</div>';

    body += '<div class="card"><h2>Ключ</h2>'+
      '<p class="sub">Невеста задаёт ключ из трёх слов. Мирные видят все три настоящих, джигиты видят тоже три слова на тех же местах, но часть из них — подделка.</p>'+
      '<div class="setting-row"><div class="lbl">Сколько слов у джигитов настоящие</div>'+
        '<select class="mini" id="cfgJigitKey">'+
          '<option value="2"'+(!cfg.jigitKeyWords||cfg.jigitKeyWords==="2"?" selected":"")+'>2 настоящих, 1 подделка</option>'+
          '<option value="1"'+(cfg.jigitKeyWords==="1"?" selected":"")+'>1 настоящее, 2 подделки</option>'+
        '</select></div>'+
      (locked ? '<p class="sub">Применится при следующей смене ключа невестой или новой партии.</p>' : '')+
      '</div>';

    body += '<div class="card"><h2>Конкурсы при ничьей</h2><p class="sub">Один выбирается случайно, когда голоса «изгнать/оставить» равны (и когда невеста разыгрывает тост).</p>';
    comps.forEach(function(c, i){
      var nc = normComp(c);
      body += '<div class="comp-row"><div class="txt"><b>'+esc(nc.name)+'</b><br>'+esc(nc.desc)+'</div><button class="rm" data-rmcomp="'+i+'">✕</button></div>';
    });
    body += '<div style="height:10px"></div>'+
      '<input type="text" id="newCompName" placeholder="Название конкурса…"/>'+
      '<div style="height:8px"></div>'+
      '<input type="text" id="newCompInput" placeholder="Описание конкурса…"/>'+
      '<div style="height:8px"></div>'+
      '<button class="btn secondary small" id="addCompBtn">Добавить конкурс</button>'+
      '</div>';

    body += '<div class="card"><h2>Опасная зона</h2>'+
      '<p class="sub">Стирает всех игроков, роли и историю партии. Настройки выше сохранятся.</p>'+
      (resetArmed
        ? '<button class="btn" style="background:var(--bad)" id="resetConfirmBtn">Да, стереть всё и начать заново</button>'
        : '<button class="btn secondary" id="resetBtn">Сбросить игру</button>'
      )+
      '</div>';

    body += '<button class="btn ghost" data-back="1">← Назад к игре</button>';

    render(topbar()+body);

    var tmt = document.getElementById("testModeToggle");
    if(tmt) tmt.onclick = function(){ patchGameState({testMode: !testOn}); };

    function saveCfg(patch){
      var merged = Object.assign({}, cfg, patch);
      patchGameState({roleConfig: merged});
    }
    var cbr = document.getElementById("cfgBride"); if(cbr) cbr.onchange = function(){ saveCfg({brideUid:cbr.value||null}); };
    var cj = document.getElementById("cfgJigit"); if(cj) cj.onchange = function(){ saveCfg({jigitCount:cj.value}); };
    var cz = document.getElementById("cfgZhenih"); if(cz) cz.onchange = function(){ saveCfg({zhenih:cz.value}); };
    var cb = document.getElementById("cfgByvshaya"); if(cb) cb.onchange = function(){ saveCfg({byvshaya:cb.value}); };
    var cf = document.getElementById("cfgFotograf"); if(cf) cf.onchange = function(){ saveCfg({fotograf:cf.value}); };
    var ck = document.getElementById("cfgJigitKey"); if(ck) ck.onchange = function(){ saveCfg({jigitKeyWords:ck.value}); };

    root.querySelectorAll("[data-rmcomp]").forEach(function(el){
      el.onclick = function(){
        var idx = parseInt(el.getAttribute("data-rmcomp"), 10);
        var next = comps.slice(); next.splice(idx,1);
        patchGameState({competitionsList: next});
      };
    });
    var addCompBtn = document.getElementById("addCompBtn");
    if(addCompBtn) addCompBtn.onclick = function(){
      var vName = document.getElementById("newCompName").value.trim();
      var vDesc = document.getElementById("newCompInput").value.trim();
      if(!vDesc) return;
      patchGameState({competitionsList: comps.concat([{name: vName||"Конкурс", desc: vDesc}])});
    };

    var rb = document.getElementById("resetBtn");
    if(rb) rb.onclick = function(){ resetArmed = true; screenSettings(); };
    var rcb = document.getElementById("resetConfirmBtn");
    if(rcb) rcb.onclick = resetGame;
  }

  function screenInfo(){
    clearTimerLoop();
    var body = '<div class="card"><h2>Цель игры</h2>'+
      '<p class="sub">Джигиты хотят украсть невесту. Пока жив хоть один обычный гость, красть можно только гостей — невеста становится доступной целью, только когда обычных гостей не осталось: следующая ночь решающая. Мирные побеждают, изгнав всех джигитов голосованием.</p></div>';

    body += '<div class="card"><h2>Роли</h2>';
    Object.keys(ROLE_LABEL).forEach(function(r){
      body += '<div style="margin-bottom:12px"><div class="rolebadge" style="margin-bottom:4px">'+esc(ROLE_LABEL[r])+'</div>'+
        '<p class="sub" style="margin:0">'+esc(ROLE_DESC[r])+'</p></div>';
    });
    body += '</div>';

    body += '<div class="card"><h2>Порядок действий за ночь</h2>'+
      '<ol class="order-list">'+
      '<li><b>Бывшая</b> и <b>жених</b> одновременно выбирают, кого заблокировать (увести танцевать / набить морду) — заблокированный не сможет этой ночью совершить своё действие. Если они выбрали друг друга взаимно — оба блока аннулируются, как будто никто никого не блокировал.</li>'+
      '<li><b>Джигит</b> (главный) выбирает, кого украсть — если он заблокирован (бывшей или женихом), кражи не будет.</li>'+
      '<li><b>Фотограф</b> проверяет, действовал ли выбранный им человек этой ночью — узнаёт об этом только сам, утром. Если заблокирован он сам — ничего не узнает.</li>'+
      '<li><b>Невеста</b> может сменить общий ключ (не более двух раз за игру) — действует независимо от остальных.</li>'+
      '<li>Параллельно с этим <b>гости</b> голосуют, изгонять ли того, кто говорил тост.</li>'+
      '</ol></div>';

    body += '<div class="card"><h2>Спорные случаи</h2><ul class="rules-list">'+
      '<li>Если тостующего этой же ночью и украли, и изгнали голосованием — это один и тот же человек, он просто один раз выбывает.</li>'+
      '<li>Утром никогда не говорится, украли человека или изгнали голосованием — он просто «исчезает со свадьбы», а его роль раскрывается. Как именно он выбыл, остаётся загадкой.</li>'+
      '<li>Если бывшая и жених выбрали друг друга взаимно (увела его танцевать, а он в ответ полез драться) — оба блока взаимно аннулируются, как будто этой ночью они оба просто разбирались между собой и никого больше не трогали.</li>'+
      '<li>Если бывшая заблокировала жениха (а он её — нет), его попытка набить морду не засчитывается, и его цель спокойно действует. Если жених заблокировал бывшую (а она его — нет), её цель тоже освобождается.</li>'+
      '<li>Если голоса «изгнать» и «оставить» равны — вместо решения устраивается конкурс между тостующим и случайным живым гостем; кто проиграл в реальности, решает невеста, нажав на его имя.</li>'+
      '<li>Если выбывает главный джигит, а другие (их может быть до трёх) ещё живы — со следующей ночи главным становится следующий по очереди.</li>'+
      '<li>Жених не может тронуть невесту ни при каких условиях.</li>'+
      '<li>Джигит может выбрать невесту целью, только когда счётчик живых обычных гостей равен нулю.</li>'+
      '<li>Кто говорит следующий тост, решает невеста — сама или разыгрывая конкурс из списка: кто в нём проиграл, тот и говорит тост (это не связано с конкурсом при ничьей на голосовании).</li>'+
      '<li>Нельзя по приколу подговариваться и подсуживать, чтобы в конкурс специально попал конкретный человек (например, Денис) — выбор и исход конкурса должны быть честными.</li>'+
      '</ul></div>';

    var comps = getCompetitions();
    body += '<div class="card"><h2>Конкурсы при ничьей</h2><ul class="rules-list">'+
      comps.map(function(c){ var nc=normComp(c); return '<li><b>'+esc(nc.name)+'</b> — '+esc(nc.desc)+'</li>'; }).join("")+
      '</ul></div>';

    body += '<button class="btn ghost" data-back="1">← Назад к игре</button>';
    render(topbar()+body);
  }

  function screenEliminated(){
    var body = '<div class="card"><h2>Ты выбыл(а) из игры</h2>'+
      '<p class="sub">Свадьба продолжается без тебя — активных действий и голосований для тебя больше нет. Можешь заглянуть в лог игры, чтобы узнать, что происходило по раундам.</p>'+
      '</div>'+
      '<button class="btn secondary" id="openLogBtn">📜 Открыть лог игры</button>';
    render(chrome()+body);
    var olb = document.getElementById("openLogBtn");
    if(olb) olb.onclick = function(){ navOverride="log"; renderCurrent(); };
  }

  function draw(){
    clearTimerLoop();
    if(!myUid) return;
    var me = players[activeUid];
    if(!gameState || !gameState.started){
      screenLobby();
      return;
    }
    if(!me){
      // joined room after game started -> treat as spectator prompt
      render(chrome()+'<div class="card"><h2>Свадьба уже началась</h2><p class="sub">Дождись следующей партии, либо попроси хозяина начать заново.</p></div>');
      return;
    }
    var activePhases = ["toast","night","pickspeaker","competition"];
    if(!me.alive && activePhases.indexOf(gameState.phase)!==-1){
      screenEliminated();
      return;
    }
    switch(gameState.phase){
      case "keysetup": screenKeySetup(); break;
      case "pickspeaker": screenPickSpeaker(); break;
      case "toast": screenToast(); break;
      case "night": screenNight(); break;
      case "competition": screenCompetition(); break;
      case "morning": screenMorning(); break;
      case "ended": screenEnded(); break;
      default: screenLobby();
    }
  }

  centerMsg("Наливаем…");
  boot();
})();
</script>
